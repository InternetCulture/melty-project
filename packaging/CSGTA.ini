; CS:GTA settings. Delete this file to get the defaults back.

[General]
; Turns the whole mod on and off in game.
ToggleKey = F10

[Camera]
; Always play in first person, on foot and in every vehicle.
ForceFirstPerson = true

[Movement]
; Counter-Strike 2 running, stopping, counter-strafing and air strafing.
CounterStrikeMovement = true
; Sprint key walks quietly at 52% speed, like Shift in Counter-Strike.
SprintKeyWalks = true

[Guns]
; Counter-Strike 2 damage, fire rate, magazine size and reload time on GTA's guns.
CounterStrikeGuns = true
; Counter-Strike spray patterns. Pull down against the spray to keep it on target.
SprayRecoil = true

[Sounds]
; Gun sounds from your own Counter-Strike 2 install.
CounterStrikeSounds = true
; Fits a GTA suppressor where the gun takes one, so only the Counter-Strike shot is loud.
QuietGtaGunfire = true
Volume = 0.8
; Leave empty to find Counter-Strike 2 through Steam automatically.
CounterStrike2Folder =
